    <div class="bio-text">

      <p>
        Chanmin Kim works primarily with film and sound, exploring the traces and sensations left behind by particular experiences and events.
        Instead of trying to reproduce an experience as it happened, he is interested in how memory changes it over time.
        Through an unconscious process of self-reflection, memories slowly change again and again. He accepts these distortions and uses them as a way of reconstructing what happened.
        His narratives do not necessarily unfold in a linear way.
        Fragments of memories, sensations, and images are rearranged into non-linear and sometimes non-narrative forms, allowing past events to return and be experienced from the perspective of the present.
        <br><br>
        Chanmin Kim was born in Seoul in 1994. He studied drawing from an early age and later majored in animation in high school. At university, he studied media art and mainly worked with video. It was during this time that he discovered the term “experimental film” and began to understand his own work in relation to it.
        During his university years, he became deeply involved in pantomime and eventually devoted himself almost entirely to it. After graduating, he returned to making films independently, while also going back to painting and beginning to make folk music.
        Chanmin makes films, paints, and writes and sings songs. He moves freely between these different forms, following whatever medium feels necessary for the work. He currently lives and works in Cologne, Germany, continuing to explore different ways of making and performing.

    function positionCaption() {
      const image = $("mediaImage");
      const caption = $("caption");
      const wrap = document.querySelector(".media-wrap");

      if (!image.complete || !image.naturalWidth) return;

      const stage = document.querySelector(".media-stage");

      const stageRect = stage.getBoundingClientRect();
      const wrapRect = wrap.getBoundingClientRect();

      const imageRatio =
        image.naturalWidth / image.naturalHeight;

      const stageRatio =
        stageRect.width / stageRect.height;

      let imageWidth;
      let imageHeight;
      let imageLeft;
      let imageTop;

      /*
        Calculate the actual visible image size
        inside the fixed 4:3 area.
      */

      if (imageRatio > stageRatio) {

        // Image is wider → empty space top/bottom
        imageWidth = stageRect.width;
        imageHeight = imageWidth / imageRatio;

        imageLeft = stageRect.left;
        imageTop =
          stageRect.top +
          (stageRect.height - imageHeight) / 2;

      } else {

        // Image is taller/narrower → empty space left/right
        imageHeight = stageRect.height;
        imageWidth = imageHeight * imageRatio;

        imageLeft =
          stageRect.left +
          (stageRect.width - imageWidth) / 2;

        imageTop = stageRect.top;
      }

      /*
        Position caption directly underneath
        the actual visible image.
      */

      caption.style.left =
        (
          imageLeft +
          imageWidth -
          caption.offsetWidth -
          wrapRect.left
        ) + "px";

      caption.style.top =
        (
          imageTop +
          imageHeight +
          5 -
          wrapRect.top
        ) + "px";
    }

    $("mediaImage").addEventListener("load", positionCaption);
    window.addEventListener("resize", positionCaption);

  /* =====================================================

   ===================================================== */

const totalSlides = w.slides.length;
const groupStart = Math.floor(currentSlide / 5) * 5;
const dotCount = Math.min(5, totalSlides - groupStart);

$("dots").innerHTML =
  Array.from({ length: dotCount }, (_, i) => {

    const slideIndex = groupStart + i;

    return `
      <button
        class="dot ${slideIndex === currentSlide ? "active" : ""}"
        aria-label="Slide ${slideIndex + 1}"
        data-slide="${slideIndex}">
      </button>
    `;

  }).join("");

/* =====================================================

document.querySelectorAll(".dot").forEach(dot => {

  dot.onclick = () => {

    currentSlide = Number(dot.dataset.slide);

    renderSlide();

  };

});

  positionCaption();
}
