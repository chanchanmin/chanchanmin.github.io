    <div class="bio-text">

      <p>
        Chanmin Kim works primarily with film and sound, exploring the traces and sensations left behind by particular experiences and events.
        Instead of trying to reproduce an experience as it happened, he is interested in how memory changes it over time.
        Through an unconscious process of self-reflection, memories slowly change again and again. He accepts these distortions and uses them as a way of reconstructing what happened.
        His narratives do not necessarily unfold in a linear way.
        Fragments of memories, sensations, and images are rearranged into non-linear and sometimes non-narrative forms, allowing past events to return and be experienced from the perspective of the present.
        <br><br>
        Chanmin Kim was born in Seoul in 1994. He studied drawing from an early age and later majored in animation in high school. At university, he studied media art and mainly worked with video. It was during this time that he discovered the term “experimental film” and began to understand his own work in relation to it.
        During his university years, he became deeply involved in pantomime and eventually devoted himself almost entirely to it. After graduating, he returned to making films independently, while also going back to painting and beginning to make folk music.
        Chanmin makes films, paints, and writes and sings songs. He moves freely between these different forms, following whatever medium feels necessary for the work. He currently lives and works in Cologne, Germany, continuing to explore different ways of making and performing.

          `Of course. I should give up my seat. Ma’am, please, sit here. But I’m not Light Green’s little brother. How could someone’s name be Light Green? How could a person’s name be so harmless? You got your hair done. Where did you get it done? That navy blue school vest really suits you. My hair? Yes. It’s gotten quite long. Maybe I’ll twist my hair like yours, too. But noona, how are you so confident? It’s as if you could swallow this entire village bus. Don’t they say anything at school? Looks like you dyed your hair, too. That’s why I go to school every day at six in the morning. There are a few guys like me when I get there. Funny and cute, aren’t we? How have you been these days? Even if I become an middle aged man, you’ll still be noona. Even if I call myself an uncle, you’ll always be noona. You’ve probably gotten married by now. Maybe you even have a child. Is your child as confident as you were, noona? Does your child sometimes struggle to swallow that little village bus, too? I rarely see that village bus anymore. By now, the bus has become so small that By now, the bus has become so small that I can reach every handrail without worrying about what anyone thinks, but I still can’t swallow it. In the meantime, I went to the army, and they say the fare for the village bus has become eight times more expensive than when I was born. Yet this road, where a dump-truck-looking bus keeps rolling and tumbling along, hasn’t changed at all, no matter how generously they try to make it look nice.² That road sometimes thinks of Light Green’s little brother. What could his name be? They say it isn’t Green. Because Green isn’t mysterious. How about Sky Blue? The sky is mysterious, endless. So how have you been, then? Did you throw yourself into self employment? Or do you make wooden crafts and sell them, or maybe you’re doing something to discern someone else’s mystery, or selling cheap wallets? Still, noona, there’s no discouragement, right? Because people like me have always believed that only someone like you could swallow this bus. Once you get off, this bus will keep getting bigger and bigger, big enough to swallow the whole world. On this village bus gone completely berserk, everyone knows only how to get on first and get off last and no one gives up their seat to the old lady. Just like that little trickery I sometimes gave the driver as a gift. Noona, please please come back and restore order to this bus. Could you gather all these people together and teach them what peace is? In this place where nothing remains but mystery, we need your confidence, noona.`,
        noteKo: "¹ \"난 그동안 군대도 다녀 왔고 내가 태어났을 때보다 짜장면은 열배나 비싸졌다는데 짬통같은 버스가 뒤굴뒤굴 굴러다니는 이 길은 보기좋게 선심써서 두배정도 좋아졌다.\" - 달빛요정역전만루홈런, 「361 타고 집에 간다」, 2004",
        noteEn: "¹ Noona (누나): a Korean term used by a younger man to address an older woman, whether or not they are related.<br>" +

      panini: {
        title: "파니니 생각",
        titleEn: "Panini Thoughts",
        contentKo: "참!<br>눈빛들을 기대하고 떠나보내는 데에<br>특별한 장소는 없을 거야<br>어떤 눈빛들이 기억에 남아? 물으면<br>단연코 자랑스러움과 내가 울려버린 눈동자들<br>돌담 위 등진 눈동자에 내 평생을 바칠 뻔한 시퀀스와<br>그런 나를 등진 채 지나던 사람들의 눈동자들<br>고슴도치 궁전, 원숭이 인형, 참! 파니니 참 맛났지<br>내가 흘려 둔 파니니 빵가루를 소녀들이 주섬하는 밤에<br>파니니 빵가루 가로지르며<br>규칙 없는 규칙 안으로<br>4도 높은 경적 사이로<br>곯은 소녀들을 등지고<br>어쩌면 내가 미끄러진다<br>곯은 소녀들이여, 여기에 따뜻한 빛은 없구나<br>곯은 소녀들이여, 아아 곯은 소녀들아<br>하나의 파니니가 되기까지<br>얼마나 오래 빵가루를 모아야만 하는지 묻고 싶었어<br>소녀들은 내 파니니를 혀로 훔친 들개의 눈동자를 가졌거든<br>어휴 올해는 참 너무 많은 눈동자에 매혹됐어<br>난 지쳤어<br>기회가 된다면 사과나무 일을 도와야만 하는 그의 눈동자와<br>내가 훔친 아가들의 눈동자만 가지고<br>숫자 놀음을 그만둬야겠지<br>누구나 가지는 한 번의 생일이나<br>도무지 기억나지 않는 산책들<br>하늘을 보며 멍때렸던 순간들<br>다 쓴 샴푸 통, 몇 번이나 사용한 면도날<br>젖은 바닥과 살아냈다는 증거처럼 자연스럽게<br>깃털 깃털 깃털과 타는…<br>참! 오늘 눈이 무지하게 내렸어<br>눈 쌓인 길, 파니니 생각",
        contentEn: "Ah!<br>There will be no special place<br>to expect the eyes and let them go<br>When they ask me, Which eyes do you remember?<br>Without a doubt, the proud, and the eyes I made cry<br>The sequence in which I almost devoted my whole life to the eyes I had turned<br>my back on atop the stone wall, and the eyes of those who passed by with their backs turned to me<br>Hedgehog Palace, the monkey doll, oh, right! The panini was really delicious<br>On the night when girls gathered up, one by one, the panini crumbs I had left behind<br>crossing through the panini crumbs<br>into rules without rules<br>through the horns four degrees higher<br>with my back turned to the girls gone rotten<br>perhaps I slip<br>Oh, girls gone rotten, there is no warm light here<br>Oh, girls gone rotten, ahh rotten girls<br>How long one has to gather breadcrumbs<br>to becoming a single panini, I wanted to ask<br>Because the girls had the eyes of stray dogs that stole my panini with their tongues<br>Oh, this year I was captivated by far too many eyes<br>I’m tired<br>If the chance comes, I suppose I should stop playing with numbers,<br>with only the eyes of the one who must help with the apple-tree work,<br>and the eyes of the children I stole<br>One birthday thateveryone has<br>or walks I cannot remember at all<br>moments when I stared blankly at the sky<br>an empty shampoo bottle, a razor blade I used many times<br>the wet floor, naturally, like evidence of having lived through it<br>feather feather feather and burning…<br>Oh, right! It snowed like crazy today<br>A snow covered road, thinking of panini",
        note: ""
      },

      elbow: {
        title: "팔꿈치",
        titleEn: "Elbow",
        contentKo: "시인에게 사랑에 빠지는 일은<br>너무나 쉬워서 너무나 하찮고<br>그렇게 누군가의 시집을 손에 쥘 때마다<br>쉽고 하찮은 사랑에 그의 삶을 관망하거나<br>그이로부터 비롯된 순간들을 읽는<br>것을 넘어 그의 세계로 들어가려는 위험<br>아무리 도태된다 한 들 멈출 수 없는 일 같은 일<br>해가 간판에 걸쳐지는 일처럼 오늘도<br>누군가와 사랑에 빠져<br>그의 팔꿈치가 정박해있던 어느 가게를 상상하며<br>어디가 좋을까<br><em>- 어디가 좋을까?</em><br>어디가 좋을지<br><em>- 어디가 좋을지</em><br>어딘가를 다녀보지 않았으므로<br>그곳으로 자연스럽게<br>누군가의 등에 거미가 있고 누군가는 타월을 걷는<br>수심 가득한 구멍과 창덕궁 그리고 창경궁이 있는<br>그의 팔꿈치가 정박한 그곳에서<br>그의 팔꿈치를 보며 그의 팔이<br>얼마나 탔을지<br>얼마나 탔을지를 헤어려보는 일<br>그러다<br>그러다<br>팔꿈치로만 만들어지는 유리컵 표면에<br>물방울이 매달렸다 흐르는<br>수심 가득한 모자들이 걸리고<br>누군가의 등에는 거미가 있는 세계를<br>그 세계를 사랑하는 일",
        contentEn: "To fall in love with a poet<br>is so easy and so insignificant<br>That whenever I hold someone’s book of poems in my hands<br>to look over their life through an easy and insignificant love<br>or to read the moments that came from them,<br>beyond that the danger of trying to enter their world<br>A thing like something that cannot be stopped, even if one becomes obsolete<br>Like the sun hanging over a sign, today again<br>falling in love with someone,<br>and imagining some shop where their elbow had been anchored<br>Where would be good?<br><em>- Where would be good?</em><br>Where would it be good?<br><em>- Where would it be good?</em><br>Because I have never been somewhere<br>to that place naturally<br>where there is a spider on someone’s back<br>where someone takes down a towel<br>where there are holes filled with worries and Changdeokgung and Changgyeonggung<br>at that place where their elbow is anchored<br>looking at their elbow how much their arm<br>might have been tanned<br>counting how much it might have been tanned<br>And then<br>And then,<br>a world where,<br>on the surface of a glass cup made only of an elbow<br>a drop of water hangs and flows<br>hats filled with worries are hanging<br>and there is a spider on someone’s back<br>to love that world",
        noteEn: ""
      },

      240825: {
        title: "교량",
        titleEn: "Bridge",
        contentKo: "오늘은 산책을 했습니다<br>몇 번이고 자연을 칭찬했습니다<br>멋지다, 참 멋지다<br>집으로 돌아가는 길엔 전철을 타고 교량도 가로질렀지요<br>가로지르며 저 가까우면서도 먼<br>먼지 섞인 피로 뒤덮인 첨탑을 그리고<br>그 앞에 떨어져 우는 빛으로 빚어진 자욱들을 보니 생각납니다 <br>이상하게 산책이 하고 싶던 끔찍했던 8월의 이곳<br>날아가는 기타<br>기타는 꼭 내가 본 가장 긴 롱테이크 샷처럼 느리게 느리게 유영합니다<br>기타를 몇 번이고 칭찬했습니다<br>멋지다, 참 멋지다<br>물이 올랐기 때문에 사라져버린 해변의 잔상을 보는 일은 어땠을 지<br>이상하게도 조용해지고 싶었습니다<br><em>나는 정말 취했었어..</em><br><em>나는 정말 취했었어..</em><br>나로부터 세상으로 떨어진 알 수 없는 말들은, 왜?<br>내가 다시 태어난다면 해변의 자욱들로 만들어진<br>그의 눈물이 만들어낸 큰 강 교량 위에서 태어나려 합니다<br>긴 교량에서 나는 조용할 테죠<br><em>나는 술에 취해 기타를 던졌어..</em><br><em>나는 술에 취해 기타를 던졌어..</em><br>기타는 너무 느려 마치 유에프오 같고요<br>이 모든 게 참 위대하지 않니?<br>어제는 정말 큰 비를 온몸으로 맞았대<br>낮은 초록 모자 챙 끝에선 고이고 고인 빗물이 뚝 뚝 떨어졌어요<br>물은 가장 낮은 곳을 향해 간다면서요?<br>그 빗물 모아 큰 호수를 만들면 되겠다<br>그런 상황에선 모든 것들이 부끄럽지도 않지만<br>그 끔찍했던 8월엔 나는 정말 정말 부끄러웠습니다<br>일요일의 이 바람이 너무 좋습니다<br>반성으로 만들어낸 이 시원함이 달갑습니다<br>그를 위해 살겠다고 했을 때 그의 눈이 참 예뻤어요<br>고통으로 만들어낸 눈물 그 속에는 얼마의 후회가 들어있었을까요?",
        contentEn: "Today, I went for a walk<br>I praised nature over and over again<br>Beautiful, truly beautiful<br>On my way back home, I took the train and crossed the bridge<br>As I crossed it, I saw the steeple, so near, yet so far<br>covered in the dust and blood<br>and as I looked at the traces of light falling and soaking before it, I began to remember<br>That dreadful August, when I strangely longed to take a walk<br>The flying guitar<br>The guitar floated slowly, so slowly<br>like the longest long take scene I’ve ever seen<br>I praised the guitar over and over again<br>Beautiful, truly beautiful<br>How would it be like to look at the afterimage of a beach that disappeared beneath because of the rising water<br>Strangely, I only wanted to be quiet.<br><em>I was really drunk..</em><br><em>I was really drunk..</em><br>The unknown words fell from me fell into the world, why?<br>If I were to be born again<br>I would be born upon the great river bridge<br>made from the<br>traces of the beach<br>from the tears she shed<br>On that long bridge, I would be quiet<br><em>I was drunk and threw my guitar..</em><br><em>I was drunk and threw my guitar..</em><br>The guitar moved so slowly<br>it would be looked like a UFO<br>Isn’t all of this magnificent?<br>I heard I got soaked to the bone in a really heavy rain yesterday<br>and from the brim of the low green hat, rainwater dripped steadily, drop by drop<br>They say water always flows to the lowest place?<br>Then maybe we could gather those drops and make a great lake<br>In such a moment, these things wouldn’t even feel embarrassing<br>In that dreadful August<br>I was truly, deeply ashamed<br>This Sunday breeze feels so wonderful<br>I welcome this brisk, born from reflection<br>When I said I would live for her, her eyes were so beautiful<br>How much regret must have been contained in the tears grow of her pain?",

      240318: {
        title: "치열 교정",
        titleEn: "Orthodontics",
        contentKo: "내 하관 치열을 칭찬한 그 간호사,<br>자신이 본 하관 치열 중 가장 고르다며.<br>친구의 치아 교정을 칭찬한 일,<br>내가 본 치아 교정 중 가장 자연스럽다며.<br>사랑이 전부인 세계에서 사랑하는 일,<br>이것 봐, 시간이 참 빠르게 흘렀다며.<br>사랑이 전부인 세계에서 사랑이 두번 째가 되는 일,<br>그런데도 시간은 너무 느리게 간다며.<br>끝없는 행복은 불행을 낳는다는 말,<br>끝없는 슬픔은 무얼 낳나?<br>「늘 지금처럼」¹이 나오던 드럭스토어,<br>내가 미워보일 때도 나를 안아줘.²<br>‘너무 슬퍼요’ 그래서 곱씹었다던,<br>혼자이고 싶지만 홀로이고 싶지는 않아요.<br>Green Zone,<br>녹색지대³.<br>내 턱 근육을 보고 그 치과의사는,<br>데드리프트 같은 운동 하세요?<br>아뇨, 잘 모르겠어요.<br>음 음 음.. 노래 제목이 뭐였더라..<br>바다도 추억도 아닌 부산이 좋은 이유라며,<br>단지 사투리에 둘러쌓인다는 게 좋다며,<br>고독이 널 강하게 한다고.<br>나도 부산에 가볼까.<br>바다도 추억도 고독도 아닌 너를 더 이해하기 위해서.<br>가는 길, 목 축일 수 있도록 너의 눈물 좀 모아줄래?<br>한 모금 한 모금 반성하는 여정.",
        contentEn: "That nurse who praised the alignment of my lower teeth,<br>saying they were the straightest lower teeth she had ever seen.<br>The fact that I praised my friend’s straightened teeth alignment,<br>saying it was the most natural looking result of orthodontic treatment I had ever seen.<br>To love in a world where love is everything,<br>saying, look at this, time has passed so quickly.<br>To love becoming second in a world where love is everything,<br>and yet, saying that time passes so slowly.<br>The words that endless happiness gives birth to unhappiness,<br>what does endless sadness give birth to?<br>The drugstore where 「always like now」¹ used to come out,<br>hold me even when I look hateful.²<br>'I’m so sad' and so, they said they kept turning it over in mind,<br>Want to be alone, but don’t want to be lonely.<br>Green Zone³,<br>the green zone.<br>And that dentist, looking at my jaw muscles,<br><em>Do you do exercises like deadlifts?</em><br>No, I don’t really know.<br>Hmm hmm hmm.. what was the title of that song again..<br>Saying that the reason they like Busan is neither the sea nor memories,<br>saying that they simply like being surrounded by the dialect,<br>That solitude makes you stronger.<br>Should I go to Busan too?<br>In order to understand you more,<br>who are neither the sea nor memories nor solitude.<br>On the way there, could you collect some of your tears so that I can wet my throat?<br>One sip and one sip, a journey of repenting,",

        title: "얼터너티브 힖스크라프트",
        titleEn: "Alternativ Hilfskraft",
        contentKo: "한결같은 동생을 마주한 게 왜 그렇게나 슬펐는지, 동생 대신 그의 방이 물음에 대답해 주는 것 같았다. 머리를 감고 거름 망에 쌓인 음식물들을 긁어내며 나는 동생의 이불에 표정을 묻는다. 음.. 우리에겐 한때 비좁았던 집이 있었지. 나는 그곳으로부터 수많은 슬픔을 꿈꾸었지만 그곳이 생기 없는 시선으로 가득 찬다는 건 아무래도 내가 예상한 슬픔은 아녔다..;; 아무리 내가 그곳에 머물고 있지 않더라도 그건 결코 내가 예상할 수 있는 슬픔이 아녔다. 누워서 TV를 보는 동생의 눈을 보며, 허리가 굽고 말라 눈꺼풀 두 개 치켜세울 힘도 없는 어느 한 노파의 눈을 떠올린다. 그저 시선으로만 본인 밖을 바라보는 그 가엾은 노파의 눈(,)과 피부 연고를 발라주는 것으로 모든 것을 회개할 줄 아는 나의 이 눈을. 뜬 눈을 뜬 눈으로 바라본다는 건 여전히 무서운 일이기에 나는 아직 시선 뒤에 숨어 다니지만 노파의 눈은 그래, 감겨있는지 열려있는지 구분이 어려워 몰래 바라보기에 딱 좋았다지. 며칠 전엔 비행기에 같이 태워야 할 것들이 많다는 문장을 썼는데 오늘 그 문장을 바꿔볼까 찰나 고민했으나 아무래도 무언가가 재가 된다는 것 또한 내가 예상한 슬픔의 밖이라.. (이러나저러나 애도는 나와 많이 멀구나) 따지고 보면 나는 슬픔을 외부에서 바라본 적 있었나? 내 슬픔 한 데 가득 모아 태워 보내다 보니 나는 이제 그걸 동생으로부터, 동생의 방으로부터 찾고 있고 한 때 비좁았던 집으로부터, 노파의 시선으로부터, 노파의 시선으로 가득 찬 집으로부터, 사랑할 줄 아는 사람으로부터 찾았네. 그렇다 해도 보살핀다는 것으로 슬픔을 잊을 줄 알게 된 건지는 여전히 알 수는 없지만…",
        contentEn: "Why it was so sad to be faced with a younger brother who had remained so unchanging, It seemed as though his room was answering the questions in his place. After washing my hair and while scraping the food scraps piled up in the strainer, I bury my expression in my brother’s blanket.. Hmm… We once had a house that was too narrow for us. I dreamed countless sorrows from that place, but the fact that it would become filled with lifeless gazes was, somehow, not the sorrow I had expected..;; No matter that I am no longer staying there, it was never a sorrow I could have expected. Looking into my brother’s eyes as he lies there watching TV, I think of the eyes of an old woman, her back bent and her body thin, with not even enough strength to lift her two eyelids.  Her poor eyes who look outside of herself with nothing but a gaze, and these eyes of mine, which believe that they can repent for everything simply by applying skin ointment. To look at open eyes with open eyes is still a frightening thing, so I still hide behind my gaze as I move about. But the old woman’s eyes, yes, it was just right for secretly looking at them, because it was difficult to tell whether they were closed or open. A few days ago, I wrote a sentence about there being so many things that had to be taken onto the airplane together, but for a brief moment today, I wondered if I should change that sentence, but after all, something turning to ash is also outside the sorrow I had expected.. (Anyways, mourning is still very far away from me.) come to think of it, have I ever looked at sorrow from the outside? Having gathered all my sorrow into one place and send it away, I now find it in my brother, in my brother’s room, in the house that was once too narrow, in the old woman’s gaze, in the house filled with the old woman’s gaze, and in people who know how to love. Even so, I still cannot know whether caring her has taught me how to forget sorrow…",
      },

      sambu: {
        title: "삼부 컴비니언",
        titleEn: "Sambu Comvenience",
        contentKo: "삼부 컨비니언¹을 삼부 컴비니언으로 오해해본다<br><br>[center]<b>[두 획의 차이는 무엇이 될 수 있을까..?!]</b>[/center]<br><br>무대 위의 막이 열리고 조명이 켜지더니<br>어거지 분장 모든 것이 얼렁뚱땅 넘어가는 하찮은 개그가 시작된다<br><br>[center]<b>두 획은 소실점이다<br>끝이 없어 보이는 고속도로 길이었다<br>그러나 고속도로 위 죽기 좋은 구석이었다가<br>시체를 은닉할 수 있는 가장 적절한 담이 되었다<br>죽음을 의미하는 2차원의 눈동자였다가도<br>모든 것을 얼렁뚱땅 넘길 수 있는<br>가장 무서운 수학기호가 되었다[/center]</b><br><br>그래, 모든 것이 얼렁뚱땅 넘어가는 순간에<br>무대의 조명이 유리창을 뚫고 내 오른 무릎 반절에 돌았다<br><br>조명은 기어코 새벽을 뒤집어 놓고 만다<br>새벽은 단어와 단어를 뒤집는다<br>말끝과 말끝을 뒤집더니 기어코 입 짓과 손 모양을 뒤집는다<br>그래서 이해와 오해가, 살인과 살해가 뒤집혔다<br>무대 위의 살인자 역 퇴장하고<br>살해당한 역 조명과 함께 바닥 아래로 꺼진다<br><br>살인자 떠날 때 이 조명 다시 돌 것이다<br>새벽보다는 이른 아침이라 부르는 게 마음에 편할 것이다<br>그는 자신이 살인을 저지른 무대 위에서 택시를 잡는다<br>그의 그림자가 살해당한 자와 똑같이 포개진다<br>모든 건 다 얼렁뚱땅 떠나기 위함이다<br><br>택시 안 라디오에서는 삼 부의 스탠딩 코미디가 나온다<br>볼 수 없어도 보이는 어거지 분장들이 라디오 안에서 튕긴다<br><br>삼부 컴비니언.<br>그렇게 세 명의 부는 라디오가 되었다<br>라디오는 두 획이 만든 소실점을 향해 달리고 있다<br>빛이 적시 적소에 찾아오고<br>무엇이 될지는 모르지만 무엇이 되어도 상관없다는 듯이 그들은<br>졸음을 뒤집으려 애쓴다<br>꼭 이 빛을 끝까지 맞겠노라며,<br>오른 무릎 반절에 도는 졸음을 뒤집어보려 한다<br><br>높은 담이 이어지니<br>코미디를 앞지르는 차들<br>코미디에 뒤처지는 차들이 있다<br>그리고 저 멀리 분주할 것만 같은 기둥들이 있다<br>라디오의 관심들이 저 기둥에 닿는다<br>그가 모든 것들을 보내는지<br>모든 것들이 그를 보내는지 알 방법이 없다<br><br>혜화동의 한 빌라가 생각이 났다<br>어느 한 빌라 한 작은 방의 한 일요일<br>그곳에도 꼭 분명 이 빛이 있었다<br>빛은 방 적시적소 곳곳에 돌고 있었다<br>텔레비전을 시작으로 장롱과 침대 끝을 지나<br>다른 방의 문을 열어버렸다<br>빛이 방을 만든 셈이다<br><br>그리고 그가 그 방 안에 있었다<br>방 안에 앉아 텔레비전을 보고 있었다<br>삼 부의 코미디는 들을 수 없었지만<br>텔레비전 회색 담요가 그의 오른 무릎 반절을 덮고 있다",
        contentEn: "Misunderstanding Sambu Convenience¹ as Sambu Comvenience<br><br>[center]<b>[What could the difference of two strokes become..?][/center]</b><br><br>The curtain on the stage opens and the lights come on,<br>and a ridiculous gag begins, with forced makeup, everything being glossed over somehow<br><br>[center]<b>The two strokes are a vanishing point<br>It was a highway road that seemed to have no end<br>it became a corner on the highway where it would be good to die<br>then the most appropriate wall for hiding a corpse<br>It was a 2 dimensional eye meaning death,<br>then became the most frightening mathematical symbol<br>with which everything could be glossed over somehow[/center]</b><br><br>Yes, at the moment when everything is being glossed over somehow,<br>the stage light pierces through the window and circles onto half of my right knee<br><br>The light inevitably turns dawn upside down<br>Dawn turns words and words upside down<br>It turns the ends of words and the ends of words upside down,<br>and eventually turns the shape of the mouth and the shape of the hands upside down<br>so understanding and misunderstanding, killing and being killed, were turned upside down<br>The murderer on the stage exits,<br>the murdered sinks beneath the floor together with the light<br><br>When the murderer leaves, this light will circles again<br>It might feel more comfortable to call it early morning rather than dawn<br>He catches a taxi on the very stage where he committed the murder<br>His shadow overlaps perfectly with the one who was murdered<br>Everything is only for the sake of leaving, somehow glossing everything over<br><br>On the taxi radio, a stand-up comedy of the three fathers is playing<br>Forced disguises that can be seen even though they cannot be seen bounce around inside the radio<br><br>Sambu Convenience<br>And so the three fathers became a radio<br>The radio is driving toward the vanishing point made by the two strokes<br>The light arrives at the right place at the right time,<br>and as if it does not matter what they become, no matter what they become,<br>they try to turn their sleepiness upside down<br>Saying that they will surely take this light all the way to the end,<br>they try to turn over the sleepiness circling around half of my right knee<br><br>As the high wall continues,<br>there are cars overtaking the comedy,<br>and cars falling behind the comedy<br>And far away, there are pillars that seem as though they must be busy<br>The interests of the radio reach those pillars<br>There is no way to know whether he is sending everything away,<br>or whether everything is sending him away<br><br>I thought of a villa in Hyehwa-dong²<br>One Sunday, in one small room of one villa.<br>There too, surely, this light was there<br>The light was circling around every part of the room, at the right places and at the right times<br>Starting with the television, passing the end of the wardrobe and the bed,<br>it opened the door to another room<br>The light had made the room<br><br>And he was inside that room<br>He was sitting inside the room, watching television.<br>I could not hear the comedy of the three parts,<br>but the television's gray blanket was covering half of his right knee",
        noteKo: "¹ 대한민국 서울특별시 길음동의 아파트 단지. 현재는 삼부르네상스(三扶 RENAISSANCE)로 바뀌었다.",
        noteEn:

          "² A city in Seoul, South Korea.",

        title: "헤어살롱 풉키",
        titleEn: "Hair Salon Ppuki",
        contentKo: "나는 서울의 어느 한 쉐어하우스에서 살고 있었어요. 신기하게도 쉐어하우스의 나머지 구성원들은 모두 나의 지인이었답니다. 근데 이상하리만치 나에게 관심이 없는 거예요. 그날은 나를 제외하고 모두 같이 저녁 외식을 하고 왔더군요. 내 인사도 받지 않은 채 그들은 소파에 앉아 비디오 게임에 열중했던 거 같아요. 저는 혼자 편의점으로 끼니를 때울 어떤 것들을 사러 갔답니다. 근데 편의점 옆에 새로 개업한 미용실이 있는 거 아니겠어요? 미용실은 노란 조명들이 화려하게 잔뜩 달려 판타지 영화에나 나올 법했어요. 나온 김에 머리나 자르고 가자는 마음으로 문을 열고 입장했어요. 미소가 묻은 인사와 함께 어떻게 자르겠냐는 헤어 디자이너의 물음에 전 머리를 기를 것이니 뒷머리만 좀 다듬어 달라고 요청했죠. 그러자 그 디자이너가 ‘풉키’ 하고 웃어버리는 거예요. 저는 속으로 ‘이 새끼가…’ 라고 했지만 애써 태연한 척을 했답니다. 오로지 제 머리카락을 위해서요. 그 디자이너는 수다를 떨며 가위질을 막 하더니 제 머리를 결국 망쳐놓고 말았어요. 대나무 빗자루가 따로 없었죠. 그래 놓고 제게 ‘수고하셨어요~’ 라고 하는데 울화통이 치민 저는 머리가 이게 뭐냐고 따졌답니다. 미친! 주위를 둘러보니 모든 스탭이 저를 보고 웃음을 참고 있는게 아니겠어요? 저는 그걸 본 순간 온몸에 힘이 풀리고 말았습니다. 이 미친 사람들을 이기는 것을 포기하고 문을 나서려는 순간 저를 담당한 디자이너가 종이를 들고 오더군요? 거기엔<br><br>[center]**   각서   **[/center]<br>[center]추후 머리에 대한 환불을 포함한<br>어떠한 이의를 제기할 수 없음.[/center]<br> 이라고 쓰여져 있었습니다. 그리곤 매장 스피커에서 영업 종료를 알리는 이마트 노래가 나오더군요? 참 나, 저는 울음을 참으며 사인을 할 수밖에 없었어요. 대나무 빗자루 같은 내 머리, 그걸 보고 일동 웃는 미친 스탭들 그리고 영업 종료를 알리는 이마트 노래까지 저는 더 이상 그곳에 머물 용기가 없었어요. 제 마지막 기억은 노란 조명 아래에서 이마트 노래에 맞춰 제게 또 오라고 손 인사하던 스탭들의 빛나는 손이랍니다.",
        contentEn: "I was living in a shared house somewhere in Seoul. Strangely enough, all the other members of the shared house were people I knew. But, strangely, they seemed to have no interest in me at all. That day, everyone except me had gone out to have dinner together. Without even responding to my greeting, they seemed to sit on the sofa, completely absorbed in playing video games. I went alone to a convenience store to buy something to eat instead. But wasn’t there a newly opened hair salon right next to the convenience store? The hair salon was filled with lots of gorgeous yellow lights, making it look like something that could only appear in a fantasy movie. Since I was already out, I thought I might as well get my hair cut, so I opened the door and went inside. With a smile in her greeting, the hair designer asked me how I wanted my hair cut, and I asked her to trim only the back of my hair a little because I was going to grow it out. Then the designer suddenly laughed, saying, “Ppuki.” Inside, I thought, “You bastard…” but I tried hard to pretend to be calm. Only for the sake of my hair. The designer kept chatting while randomly snipping away with the scissors, and eventually she completely ruined my hair. It was nothing short of a bamboo broom. And then she said to me, “It's done~,” but I was so furious that I confronted her, asking what the hell she had done to my hair. Crazy! When I looked around, weren’t all the staff trying to hold back their laughter while looking at me? The moment I saw that, all the strength drained from my body. I gave up on trying to beat these crazy people and was about to leave through the door when the designer who had been taking care of me came over holding a piece of paper. There it said:<br><br>[center]**   Memorandum   **[/center][center]<br>You may not raiseany objection<br>whatsoever in the future, <br>including a refund concerning the hair.[/center]<br>Then, an E-Mart song announcing the end of business hours started playing from the store speakers. For goodness’ sake, I had no choice but to sign it while holding back my tears. My hair like a bamboo broom, the crazy staff laughing as a group when they saw it, and even the E-Mart song¹ announcing the end of business hours, I no longer had the courage to stay there. My last memory is of the staff’s shining hands waving goodbye to me under the yellow lights, waving for me to come again to the rhythm of the E-Mart song.",
        noteEn: "¹ A CM song for E-Mart, a Korean commercial jingle based on “Happy Talk,” originally from the 1949 musical and 1958 film South Pacific. Released in 1998 and featured in a TV commercial in 2000, its distinctive repetitive rhythm later gained cult popularity in Korea and became known as one of the internet’s addictive meme songs.",
      },

      210807: {
        title: "이명",
        titleEn: "Lee Myeong",
        contentKo: "그 작은 하굣날에 짧은 키로 우리는 만나 얼마의 대화를 나눴었니? 넌 반에서 꽤나 건강한 친구였고 난 그런 너를 부러워한 친구였지. 너희 집에 놀러가자는 말에 내 기분은 어땠을까, 또 묻는 너는 어떤 기분이었니. 열쇠는 없었고, 서로만한 풀을 지나 담을 넘어 베란다 문으로 들어간 집에서 우린 뭘 했었을까? 용감한 친구야, 너의 이름을 세어보니 단 두 글자구나, 겨우 두 글자의 이름으로 네가 불리고 있었어. 가끔 네 생각이 나면 너의 이름을 몇 번 모양내어 본단다. 너는 이제 다 자라 어딘가에서 또 누구에게 묻고 있을까. 풀을 지나 담을 넘어 우리 집에 놀러올래? 열쇠가 아닌 기억이 필요한 집이지. 사라져 기억이 된 친구야 베란다 지나 이명을 걸어 넘어 우리 집에 놀러올래? 기억은 필요한 집이지만 더 이상의 용기는 필요 없는 집으로",
        contentEn: "On that small day way home from school, how long did we talk, meeting with our short heights? You were quite a healthy friend in the class, and I was a friend who envied you for being so. How did I feel when you said we should go to your house, and how did you feel, asking me? There was no door key, and after passing through grass as tall as each other and climbing over the wall, entering the house through the balcony door, what did we do there? Brave friend, counting your name, I see that it has only two letters. You were being called by a name of merely two letters. Sometimes, when I think of you, I shape your name a few times. You have now grown all the way up, somewhere, are you asking someone else again? Would you like to come over to my house, passing through the grass and climbing over the wall? It is a house that needs not a key, but memory. Friend who disappeared and became a memory, would you like to come over to my house, passing the balcony and stepping over tinnitus? It is a house that needs memory, but a house where no more courage is needed.",
      },

      201121: {
        title: "연례행사",
        titleEn: "Annual",
        contentKo: "12월이 가까워오는 매 연말의 나는 뭔가 한껏 부풀어 있더랬다. 부푼 나는 왜인지 자꾸만 서점을 기웃거린다. 그리고 이것은 이제 일 년의 마치 가장 긴 연중행사 처럼.. 나는 습관적으로 현대 시 코너나 몰스킨사의 스케쥴러가 진열된 곳에서 방황한다. 내가 상상만 했던 문장을 제목으로 가진 시집이나 몰스킨 사 공책을 완벽하게 채워 넣는 상상을 하는 것. 이것이 연말의 상책이겠다. 꽤나 반응이 좋은 이 카페의 신 메뉴를 맛 보면서 나와 풍경을 구분해 본다. 거대한 창을 사이로 드라마와 코미디를 구분짓는다. 이렇게 무서운 일이 이곳엔 참 많다. 카페에서 독일 어린이 뉴스를 보며, 한 곳에 더럽게 쌓인 테이블과 의자들을 보며 의자와 테이블이 아닐 수도 있는 조형물을 보며, 내 옆 남자의 목덜미에 있는 오래된 문신을 보며, 내가 뽑은 서가 위치 영수증을 보며, 다시 창 밖을 보며 다시 그 동생을 생각했다. 누구에게나 하나 즘 있을 법한 홀연히 사라진 동생. 그의 미스테리를 생각 해본다. 그는 분명 떠났을 것이다. 내가 그에게 겁쟁이라고 한 것이 화근이었을 거고, 그가 그날 술을 너무 많이 마셨던 것이 화근이었을 거고, 그의 몇 년이 담긴 노트북을 잃어버린 것, 그것을 되찾지 못한 것, 너무 자유롭고 행복한 것이 화근이었을 것이다. 아니, 어쩌면 그는 자신의 그 느슨한 걸음걸이를 숨기고 싶다. 한쪽은 드라마, 다른 한쪽은 코미디처럼 걷는 그 걸음걸이를. 나는 앞으로 그 동생과 어딘가 꼭 닮은 사람들을 몇 번 마주칠 것이고. 그 느슨한 걸음걸이에 속아 넘어갈 것이다. 나는 이 밤의 사거리를 나누는 신호등에 서 있다. 내가 걸어온 곳은 코미디고 나로부터 떨어진 길은 드라마다. 저기 코미디로부터 동생이 온다. 동생은 아무 말 없이 휴대폰을 두들기고 있다. 휴대폰의 불빛이 사거리의 모든 불빛을 집어 삼킨다.",
        contentEn: "As December draws near, every year-end I would swell up with something. The swollen me, for some reason, keeps tilting the bookstore. And now this has become like the longest annual event of the year. Out of habit, I wander around a place where the schedules of contemporary poets or Moleskine are displayed in a row. I imagine filling up, perfectly, a poetry book whose title is a sentence I had only imagined, or a Moleskine notebook from beginning to end. This must be my year-end stroll. Tasting the new menu of this café, which seems to be receiving quite a good response, I try to distinguish myself from the landscape. Through the enormous window, I draw a line between drama and comedy. There are truly so many frightening things in this place. At the café, watching German children’s news, looking at the tables and chairs piled up messily in one place, looking at an object that may not be a chair or a table, looking at the old tattoo on the nape of the man beside me, looking at the receipt for the book I picked from the shelf, I look outside the window again and think of a younger friend of mine. A younger friend of mine who has quietly disappeared, as if there should naturally be at least one such person for anyone. I think about his mystery. He must have left, surely. Perhaps it was because I called him a coward. Perhaps it was because he drank too much that day. Perhaps it was because he lost the laptop that contained several years of his life, because he could not get it back, because he was too free and too happy. No, perhaps he wants to hide that loose way he walks. That way of walking with drama on one side and comedy on the other. From now on, I will encounter several people who resemble him somewhere. And I will be deceived by that loose gait. I am standing at the traffic light that divides the intersections of this night. The place I have walked from is comedy, and the road falling away from me is drama. From over there, from comedy, he is coming. He is silently fiddling with his mobile phone. The light of his mobile phone swallows up all the lights of the intersection.",
      },

      191024: {
        title: "한낮의 분리수거",
        titleEn: "Daylight Recycling",
        contentKo: "그랬다. 그 사건들은 내가 모르는 사이에 화, 목, 일요일마다 박스를 모아 놓는 리어카를 지나, 만만한 그 카페와 그 안의 우울한 사내의 빈 커피잔을 지나, 버림받을 강과 옹기종기 모인 사람들을 지나, 우둔한 섹스를 지나 풀리지 않은 상실을 지나, 옹졸한 어투를 지나, 컴컴한 날씨를 넘어 어딘가의 저편으로 사라졌을 것이다. 언제의 내가 플라스틱 용기 안의 아찔한 사진들을 만난 것처럼 새삼스레 그 사건들을 알아차렸을 때, 그 사건들은 ‘사건’이라고 불리기에 자신있게 애매했다. 나는 겸허한 얼굴로 담배를 피우며 지나가서는 안될 것들이 지나가버렸다고 생각하면서도 나라고 초라해진 그 사건들을 어쩔 수는 없는 노릇이라고 말해버렸다. 그렇게 참 짜릿한 생각을 하면서 나는 한낮의 분리수거 같은 얄팍한 일을 꾀고 있었다.",
        contentEn: "So it was. Those events must have disappeared somewhere beyond, passing the handcart that collects boxes every Tuesday, Thursday, and Sunday without my knowing, passing that easygoing café and the empty coffee cup of the depressed man inside it, passing the abandoned river and the people huddled together, passing dull sex, passing the unresolved loss, passing the petty tone of voice, going beyond the dark weather. When I belatedly noticed those events, just as some version of me once encountered the dizzying photographs inside a plastic container, those events were confidently ambiguous enough to be called “events.” While smoking a cigarette with a humble face, I thought that things that should not have passed had already passed, and yet I ended up saying that there was nothing I, too, could do about those events, already made shabby like me. Thus, while having such a truly thrilling thought, I was plotting a shallow task like recycling in broad daylight.",
      },

        const isOpen = content.classList.contains("open");

        content.classList.toggle("open");

        $("screeningToggle").querySelector("span").textContent =
          isOpen ? "+" : "−";
      };


      /* =============================================================
         CREDITS DROPDOWN
         ============================================================= */

      $("creditsToggle").onclick = () => {

        const content = $("workCredits");
        const isOpen = content.classList.contains("open");

        content.classList.toggle("open");

        $("creditsPlus").textContent =
          isOpen ? "+" : "−";
      };

      /* =========================================================
         END OF renderWork()
         ========================================================= */

    }

    const savedWork =
      new URLSearchParams(window.location.search).get("work");

    if (savedWork && works[savedWork]) {
      renderWork(savedWork);
    } else {
      showHomePage();
    }

    /* =====================================================
     TEXTS PAGE
     ===================================================== */

    function renderTexts(selectedKey = null) {

      const textPage = document.getElementById("textPage");
      const textList = document.getElementById("textList");
      const textDetail = document.getElementById("textDetail");

      if (!textPage || !textList || !textDetail) return;


      /* =============================================
         HIDE NORMAL WORK CONTENT
         ============================================= */
      document.getElementById("constructionMessage").style.display = "none";
      document.querySelector(".media-wrap").style.display = "none";
      document.querySelector(".slider-controls").style.display = "none";
      document.querySelector(".work-info").style.display = "none";
      document.querySelector(".work-footer").style.display = "none";

      /* =============================================
         SHOW TEXT PAGE
         ============================================= */

      textPage.style.display = "grid";

      document.body.classList.remove("work-detail-mode");
      document.body.classList.add("text-mode");
      $("workGallery").style.display = "none";


      /* =============================================
         TEXT LIST
         ============================================= */

      textList.innerHTML = textOrder.map(key => {

        const text = textWorks[key];

        let title = key;

        const originalButton =
          document.querySelector(
            `.work-link[data-work="${key}"]`
          );

        if (text && text.title) {

          title = text.title;

        } else if (originalButton) {

          title = originalButton.textContent.trim();

        }

        return `
      <button
        class="text-list-link ${selectedKey === key ? "active" : ""}"
        data-text="${key}"
      >
        ${title}
      </button>
    `;

      }).join("");


      /* =============================================
         NO TEXT SELECTED
         ============================================= */

      if (!selectedKey) {

        textPage.classList.remove("has-selection");

        textDetail.innerHTML = "";

      }


      /* =============================================
         SELECTED TEXT
         ============================================= */

      else {

        const text = textWorks[selectedKey];

        textPage.classList.add("has-selection");


        if (text) {

          textDetail.innerHTML = `

  <div class="text-content">

    <div class="text-body">

      <div class="text-column korean">

        <h1>${text.title}</h1>

        ${text.contentKo
              ? text.contentKo
                .trim()
                .split(/\n\s*\n/)
                .map(paragraph => `
                <p>${paragraph
                    .replace(/\[center\]/g, '<span class="text-center">')
                    .replace(/\[\/center\]/g, '</span>')
                    .replace(/\n/g, "<br>")
                  }</p>
`)
                .join("")
              : ""
            }

        ${text.noteKo ? `
          <div class="text-note">
            ${text.noteKo}
          </div>
        ` : ""}

      </div>


      <div class="text-column english">

        <h1>${text.titleEn || ""}</h1>

        ${text.contentEn
              ? text.contentEn
                .trim()
                .split(/\n\s*\n/)
                .map(paragraph => `
                <p>${paragraph
                    .replace(/\[center\]/g, '<span class="text-center">')
                    .replace(/\[\/center\]/g, '</span>')
                    .replace(/\n/g, "<br>")
                  }</p>
`)
                .join("")
              : ""
            }

        ${text.noteEn ? `
          <div class="text-note">
            ${text.noteEn}
          </div>
        ` : ""}

      </div>

    </div>

  </div>

`;

        } else {

          textDetail.innerHTML = "";

        }

      }


      /* =============================================
         TEXT LIST CLICK
         ============================================= */

      textList
        .querySelectorAll(".text-list-link")
        .forEach(button => {

          button.addEventListener("click", function () {

            const key = this.dataset.text;

            renderTexts(key);

            history.replaceState(
              null,
              "",
              "?work=texts&text=" + encodeURIComponent(key)
            );

          });

        });

    }

    function positionCaption() {
      const image = $("mediaImage");
      const caption = $("caption");
      const wrap = document.querySelector(".media-wrap");

      if (!image.complete || !image.naturalWidth) return;

      const stage = document.querySelector(".media-stage");

      const stageRect = stage.getBoundingClientRect();
      const wrapRect = wrap.getBoundingClientRect();

      const imageRatio =
        image.naturalWidth / image.naturalHeight;

      const stageRatio =
        stageRect.width / stageRect.height;

      let imageWidth;
      let imageHeight;
      let imageLeft;
      let imageTop;

      /*
        Calculate the actual visible image size
        inside the fixed 4:3 area.
      */

      if (imageRatio > stageRatio) {

        // Image is wider → empty space top/bottom
        imageWidth = stageRect.width;
        imageHeight = imageWidth / imageRatio;

        imageLeft = stageRect.left;
        imageTop =
          stageRect.top +
          (stageRect.height - imageHeight) / 2;

      } else {

        // Image is taller/narrower → empty space left/right
        imageHeight = stageRect.height;
        imageWidth = imageHeight * imageRatio;

        imageLeft =
          stageRect.left +
          (stageRect.width - imageWidth) / 2;

        imageTop = stageRect.top;
      }

      /*
        Position caption directly underneath
        the actual visible image.
      */

      caption.style.left =
        (
          imageLeft +
          imageWidth -
          caption.offsetWidth -
          wrapRect.left
        ) + "px";

      caption.style.top =
        (
          imageTop +
          imageHeight +
          5 -
          wrapRect.top
        ) + "px";
    }

    $("mediaImage").addEventListener("load", positionCaption);
    window.addEventListener("resize", positionCaption);

    function showHomePage() {
      document.body.classList.remove("work-detail-mode");
      $("workGallery").style.display = "none";
      $("constructionMessage").style.display = "block";
      document.querySelector(".media-wrap").style.display = "none";
      $("prev").style.display = "none";
      $("next").style.display = "none";
    }

    let dotCount = 1;
    setInterval(() => {
      dotCount++;
      if (dotCount > 3) {
        dotCount = 1;
      }
      $("dotsAnimation").textContent = "•".repeat(dotCount);
    }, 600);
    function renderWorkGallery() {

      const w = works[currentWork];
      const gallery = $("workGallery");

      $("constructionMessage").style.display = "none";

      /* The old slider remains in the file for the special-page logic,
         but ordinary work pages do not use it. */
      document.querySelector(".media-wrap").style.display = "none";
      document.querySelector(".slider-controls").style.display = "none";

      if (!gallery || !w || !Array.isArray(w.slides)) return;

      gallery.style.display = "block";

      gallery.innerHTML = w.slides.map((slide) => {
        const src = slide[0] || "";
        const caption = slide[1] || "";

        return `
          <figure class="work-gallery-item">
            <img src="${src}" alt="${caption}">
            ${caption ? `<figcaption>${caption}</figcaption>` : ""}
          </figure>
        `;
      }).join("");
    }


    function renderSlide() {

      document.querySelector(".media-wrap").style.display = "";
      $("constructionMessage").style.display = "none";

      const w = works[currentWork];
      const current = w.slides[currentSlide];

      /* =====================================================
         CURRENT IMAGE
         ===================================================== */
      $("constructionMessage").style.display = "none";
      $("mediaImage").style.display = "";
      $("mediaImage").src = current[0];
      $("mediaImage").alt = current[1];


      /* =====================================================
         CAPTION
         ===================================================== */

      $("caption").textContent = current[1];


      /* =====================================================
       DOTS — 5 SLIDES PER GROUP
       ===================================================== */

      const totalSlides = w.slides.length;

      if (totalSlides <= 1) {
        $("dots").style.display = "none";
        $("prev").style.display = "none";
        $("next").style.display = "none";
      } else {
        $("dots").style.display = "";
        $("prev").style.display = "";
        $("next").style.display = "";
      }

      const groupStart = Math.floor(currentSlide / 5) * 5;
      const dotCount = Math.min(5, totalSlides - groupStart);

      $("dots").innerHTML =
        Array.from({ length: dotCount }, (_, i) => {

          const slideIndex = groupStart + i;

          return `
      <button
        class="dot ${slideIndex === currentSlide ? "active" : ""}"
        aria-label="Slide ${slideIndex + 1}"
        data-slide="${slideIndex}">
      </button>
    `;

        }).join("");

      /* =====================================================
         DOT CLICK
         ===================================================== */

      document.querySelectorAll(".dot").forEach(dot => {

        dot.onclick = () => {

          currentSlide = Number(dot.dataset.slide);

          renderSlide();

        };

      });

      positionCaption();
    }

    /* =============================================================
       PREVIOUS / NEXT SLIDE
       ============================================================= */

    function previousSlide() {

      const w = works[currentWork];

      currentSlide--;

      if (currentSlide < 0) {
        currentSlide = w.slides.length - 1;
      }

      renderSlide();
    }


    function nextSlide() {

      const w = works[currentWork];

      currentSlide++;

      if (currentSlide >= w.slides.length) {
        currentSlide = 0;
      }

      renderSlide();
    }

    $("prev").onclick = previousSlide;
    $("next").onclick = nextSlide;

    /* =============================================================
    OPEN CATEGORY OF CURRENT WORK
    ============================================================= */

    function openWorkCategory(key) {

      // EVENTS
      if (key === "upcoming") {
        const mainButton =
          document.querySelector('.menu-main[data-menu="events"]');

        if (mainButton) {
          mainButton.classList.add("active");
        }

        return;
      }

      // BIOGRAPHY
      if (key === "biography") {
        const mainButton =
          document.querySelector('.menu-main[data-menu="texts"]');

        if (mainButton) {
          mainButton.classList.add("active");
        }

        return;
      }

      // IMPRINT
      if (key === "imprint") {
        const mainButton =
          document.querySelector('.menu-main[data-menu="texts"]');

        if (mainButton) {
          mainButton.classList.add("active");
        }

        return;
      }

      // NORMAL WORKS
      const workButton =
        document.querySelector(`.work-link[data-work="${key}"]`);

      if (!workButton) return;

      const submenu =
        workButton.closest(".submenu");

      if (!submenu) return;

      submenu.classList.add("open");

      const mainButton =
        document.querySelector(
          `.menu-main[data-menu="${submenu.id}"]`
        );

      if (mainButton) {
        mainButton.classList.add("active");
      }
    }

    /* =============================================================
       WORK FOOTER
       ============================================================= */

    function getCurrentWorkOrder() {

      if (performanceOrder.includes(currentWork)) {
        return performanceOrder;
      }

      if (installationOrder.includes(currentWork)) {
        return installationOrder;
      }

      return workOrder;
    }


    function updateWorkFooter() {

      const order = getCurrentWorkOrder();
      const i = order.indexOf(currentWork);

      const prevKey = i > 0
        ? order[i - 1]
        : null;

      const nextKey = i < order.length - 1
        ? order[i + 1]
        : null;

      $("prevWork").querySelector("span").textContent =
        prevKey && works[prevKey]
          ? works[prevKey].title
          : "";

      $("nextWork").querySelector("span").textContent =
        nextKey && works[nextKey]
          ? works[nextKey].title
          : "";
    }

    /* =============================================================ㄴ
       PREV / NEXT WORK BUTTONS
       ============================================================= */

    $("prevWork").onclick = () => {

      const order = getCurrentWorkOrder();
      const i = order.indexOf(currentWork);

      if (i > 0) {
        renderWork(order[i - 1]);
      }
    };


    $("nextWork").onclick = () => {

      const order = getCurrentWorkOrder();
      const i = order.indexOf(currentWork);

      if (i < order.length - 1) {
        renderWork(order[i + 1]);
      }
    };

    /* =============================================================
       MAIN MENU DROPDOWN
       ============================================================= */
    document.querySelectorAll(".menu-main").forEach(function (button) {

      button.addEventListener("click", function (event) {

        event.preventDefault();
        event.stopPropagation();

        const menuId = button.dataset.menu;


        /* =================================================
           TEXTS
           ================================================= */

        if (menuId === "text") {

          renderTexts();

          history.replaceState(
            null,
            "",
            "?work=texts"
          );

          return;
        }


        /* =================================================
           EXISTING MENU SYSTEM
           ================================================= */

        const submenu = document.getElementById(menuId);

        if (!submenu) {
          return;
        }

        const isCurrentlyOpen =
          submenu.classList.contains("open");

        if (isCurrentlyOpen) {

          submenu.classList.remove("open");
          button.classList.remove("active");

        } else {

          submenu.classList.add("open");
          button.classList.add("active");

        }

      });

    });

    /* =============================================================
       WORK LINK CLICK
       ============================================================= */

    document.querySelectorAll(".work-link").forEach(function (button) {
      button.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        const key = button.dataset.work;

        if (!key) {
          return;
        }
        renderWork(key);
      });
    });

    /* =============================================================
       UPCOMING
       ============================================================= */

    $("upcomingButton").onclick = () => {

      document.body.classList.remove("text-mode", "work-detail-mode");
      $("workGallery").style.display = "none";
      $("textPage").style.display = "none";

      document.querySelector(".work-info").style.display = "";
      document.querySelector(".work-footer").style.display = "";
      document.querySelector(".media-wrap").style.display = "";
      document.querySelector(".slider-controls").style.display = "";

      history.replaceState(null, "", "?work=upcoming");
      $("constructionMessage").style.display = "none";
      document.querySelector(".media-wrap").style.display = "none";

      localStorage.setItem("currentPage", "upcoming");
      clearSidebarActive();

      $("upcomingButton").classList.add("active");
      document.body.classList.add("biography-mode");

      currentWork = "upcoming";
      currentSlide = 0;

      const w = works.upcoming;
      $("workTitle").textContent = "";
      $("workInfo").innerHTML = "";
      $("workDescription").innerHTML = w.description;
      $("workScreening").innerHTML = "";
      $("workCredits").innerHTML = "";
      $("mediaImage").src = "";
      $("mediaImage").alt = "";
      $("caption").textContent = "";
      $("dots").innerHTML = "";
      $("prevWork").querySelector("span").textContent = "";
      $("nextWork").querySelector("span").textContent = "";
    };

    /* =============================================================
       BIOGRAPHY
       ============================================================= */

    $("biographyButton").onclick = () => {
      document.body.classList.remove("text-mode", "work-detail-mode");
      $("workGallery").style.display = "none";
      $("textPage").style.display = "none";

      document.querySelector(".work-info").style.display = "";
      document.querySelector(".work-footer").style.display = "";
      document.querySelector(".media-wrap").style.display = "";
      document.querySelector(".slider-controls").style.display = "";

      history.replaceState(null, "", "?work=biography");
      $("constructionMessage").style.display = "none";
      document.querySelector(".media-wrap").style.display = "none";

      localStorage.setItem("currentPage", "biography");
      clearSidebarActive();

      $("biographyButton").classList.add("active");
      document.body.classList.add("biography-mode");

      currentWork = "biography";
      currentSlide = 0;

      const w = works.biography;
      $("workTitle").textContent = w.title;
      $("workInfo").innerHTML = "";
      $("workDescription").innerHTML = w.description;
      $("workScreening").innerHTML = "";
      $("workCredits").innerHTML = "";
      $("mediaImage").src = "";
      $("mediaImage").alt = "";
      $("caption").textContent = "";
      $("dots").innerHTML = "";
      $("prevWork").querySelector("span").textContent = "";
      $("nextWork").querySelector("span").textContent = "";
    };

    /* =============================================================
       IMPRINT
       ============================================================= */

    $("imprintButton").onclick = () => {
      document.body.classList.remove("text-mode", "work-detail-mode");
      $("workGallery").style.display = "none";
      $("textPage").style.display = "none";

      document.querySelector(".work-info").style.display = "";
      document.querySelector(".work-footer").style.display = "";
      document.querySelector(".media-wrap").style.display = "";
      document.querySelector(".slider-controls").style.display = "";

      history.replaceState(null, "", "?work=imprint");
      $("constructionMessage").style.display = "none";
      document.querySelector(".media-wrap").style.display = "none";

      localStorage.setItem("currentPage", "imprint");
      clearSidebarActive();

      $("imprintButton").classList.add("active");
      document.body.classList.add("biography-mode");

      currentWork = "imprint";
      currentSlide = 0;

      const w = works.imprint;
      $("workTitle").textContent = "";
      $("workInfo").innerHTML = "";
      $("workDescription").innerHTML = w.description;
      $("workScreening").innerHTML = "";
      $("workCredits").innerHTML = "";
      $("mediaImage").src = "";
      $("mediaImage").alt = "";
      $("caption").textContent = "";
      $("dots").innerHTML = "";
      $("prevWork").querySelector("span").textContent = "";
      $("nextWork").querySelector("span").textContent = "";
    };


    /* =============================================================
       INITIAL PAGE
       ============================================================= */

    const params =
      new URLSearchParams(window.location.search);

    const urlWork =
      params.get("work");

    const urlText =
      params.get("text");


    /*
       If a specific work was requested in the URL,
       open that work.
    
       Otherwise start with a completely blank page.
    */

    if (urlWork === "texts") {

      renderTexts(urlText);

    } else if (urlWork && works[urlWork]) {

      renderWork(urlWork);

    } else {

      localStorage.removeItem("currentPage");

      document.body.classList.add("home-page");

      $("workTitle").textContent = "";
      $("workInfo").innerHTML = "";
      $("workDescription").innerHTML = "";
      $("workScreening").innerHTML = "";
      $("workCredits").innerHTML = "";

      $("mediaImage").src = "";
      $("mediaImage").alt = "";

      $("caption").textContent = "";
      $("dots").innerHTML = "";

      $("prevWork").querySelector("span").textContent = "";
      $("nextWork").querySelector("span").textContent = "";

      document.body.classList.remove("biography-mode");

      clearSidebarActive();


    }

    /* =============================================================
       IMAGE PROTECTION
       ============================================================= */

    document.addEventListener("contextmenu", function (event) {
      if (event.target.tagName === "IMG") {
        event.preventDefault();
      }
    });

    document.addEventListener("dragstart", function (event) {
      if (event.target.tagName === "IMG") {
        event.preventDefault();
      }
    });

  </script>

</body>
